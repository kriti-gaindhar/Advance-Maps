<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps Explorer | Interactive Dark Explorer</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --glass-bg: rgba(15, 15, 20, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-neon: #00f2ff;
            --accent-purple: #bc13fe;
            --text-main: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #050505;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        /* Map Container */
        #map {
            height: 100vh;
            width: 100%;
            z-index: 1;
        }

        /* Custom UI Overlays */
        .ui-container {
            position: fixed;
            z-index: 1000;
            pointer-events: none;
            width: 100%;
            height: 100%;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: auto;
            gap: 12px;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            padding: 20px;
        }

        .search-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 380px;
            transition: all 0.3s ease;
        }

        .search-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .input-group {
            position: relative;
            flex: 1;
        }

        .input-group input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: var(--accent-neon);
        }

        .input-icon-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--accent-neon);
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .input-icon-btn:hover {
            opacity: 1;
        }

        .icon-btn {
            background: var(--accent-neon);
            color: #000;
            border: none;
            border-radius: 12px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .icon-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
        }

        .icon-btn.active {
            background: var(--accent-purple);
            color: white;
            box-shadow: 0 0 20px rgba(188, 19, 254, 0.4);
        }

        .side-info {
            width: 320px;
            pointer-events: auto;
            transition: transform 0.4s ease;
        }

        .side-info h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 8px;
            background: linear-gradient(to right, var(--accent-neon), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .coord-display {
            font-family: monospace;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
        }

        .stat-value {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent-neon);
        }

        /* Routing Panel Hide/Override */
        .leaflet-routing-container {
            display: none !important; 
        }

        /* Leaflet Overrides */
        .leaflet-container {
            background: #0b0e14 !important;
        }

        .leaflet-bar {
            border: none !important;
            box-shadow: none !important;
            margin: 24px !important;
        }

        .leaflet-bar a {
            background: var(--glass-bg) !important;
            backdrop-filter: blur(8px) !important;
            color: white !important;
            border: 1px solid var(--glass-border) !important;
            width: 40px !important;
            height: 40px !important;
            line-height: 40px !important;
            border-radius: 10px !important;
            margin-bottom: 5px !important;
        }

        .leaflet-popup-content-wrapper {
            background: var(--glass-bg) !important;
            color: white !important;
            backdrop-filter: blur(10px) !important;
            border: 1px solid var(--glass-border) !important;
            border-radius: 12px !important;
        }

        .leaflet-popup-tip {
            background: var(--glass-bg) !important;
        }

        /* Pulse Animation for Current Location */
        .pulse-marker {
            width: 20px;
            height: 20px;
            background: var(--accent-neon);
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px var(--accent-neon);
            animation: pulse 2s infinite;
        }

        .pulse-marker.end {
            background: var(--accent-purple);
            box-shadow: 0 0 15px var(--accent-purple);
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 242, 255, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(0, 242, 255, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 242, 255, 0); }
        }

        /* Tooltip for instructions and notifications */
        .notification-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            padding: 12px 24px;
            border-radius: 100px;
            border: 1px solid var(--accent-neon);
            color: var(--accent-neon);
            font-weight: 500;
            z-index: 2000;
            display: none;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            transition: all 0.3s ease;
        }

        #direction-inputs {
            display: none;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .ui-container { padding: 12px; }
            .search-container { width: 100%; }
            .side-info { display: none; }
        }
    </style>
</head>
<body>

    <div class="ui-container">
        <div class="top-bar">
            <div class="glass-panel search-container">
                <div class="search-row">
                    <div class="input-group">
                        <input type="text" id="search-input" placeholder="Search locations...">
                    </div>
                    <button class="icon-btn" id="search-btn">
                        <i data-lucide="search"></i>
                    </button>
                </div>
                
                <div id="direction-inputs">
                    <div class="search-row" style="margin-bottom: 10px;">
                        <div class="input-group">
                            <input type="text" id="start-input" placeholder="Starting point or click map...">
                            <button class="input-icon-btn" id="start-locate-btn" title="Use current location">
                                <i data-lucide="map-pin" style="width: 16px; height: 16px;"></i>
                            </button>
                        </div>
                    </div>
                    <div class="search-row">
                        <div class="input-group">
                            <input type="text" id="end-input" placeholder="Destination or click map...">
                        </div>
                        <button class="icon-btn" id="calc-route-btn" style="background: var(--accent-purple); color: white;">
                            <i data-lucide="arrow-right"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <div style="display: flex; gap: 8px; pointer-events: auto;">
                <button class="icon-btn" id="share-btn" title="Share Location" style="background: var(--glass-bg); color: var(--accent-neon); border: 1px solid var(--glass-border);">
                    <i data-lucide="share-2"></i>
                </button>
                <button class="icon-btn" id="direction-btn" title="Toggle Directions" style="background: var(--glass-bg); color: var(--accent-neon); border: 1px solid var(--glass-border);">
                    <i data-lucide="navigation"></i>
                </button>
                <button class="icon-btn" id="locate-btn" title="My Location" style="background: var(--glass-bg); color: var(--accent-neon); border: 1px solid var(--glass-border);">
                    <i data-lucide="crosshair"></i>
                </button>
            </div>
        </div>

        <div class="side-info glass-panel" id="location-details">
            <h2>Maps Explorer</h2>
            <div class="coord-display" id="coords">Lat: 0.0000, Lng: 0.0000</div>
            
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">Distance</div>
                    <div id="route-dist" class="stat-value">---</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Est. Time</div>
                    <div id="route-time" class="stat-value">---</div>
                </div>
            </div>

            <p id="info-text" style="margin-top: 20px; font-size: 0.9rem; color: #94a3b8; line-height: 1.5;">
                Explore the global node network. Drop a marker or use the share button to copy coordinates to your clipboard.
            </p>
            <button id="clear-route" style="display:none; margin-top: 15px; width:100%; background:rgba(255,255,255,0.05); color:white; border:1px solid var(--glass-border); padding:8px; border-radius:8px; cursor:pointer;">Clear Route</button>
        </div>
    </div>

    <div id="notification-toast" class="notification-toast"></div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Leaflet Routing Machine JS -->
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    
    <script>
        // Initialize Icons
        lucide.createIcons();

        // Helper: Show Toast
        const showToast = (message, duration = 3000) => {
            const toast = document.getElementById('notification-toast');
            toast.innerText = message;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, duration);
        };

        // Map Setup
        const map = L.map('map', {
            zoomControl: true,
            attributionControl: false
        }).setView([20, 0], 3);

        // Tile Layer - Using CartoDB Dark Matter
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19
        }).addTo(map);

        // State variables
        let currentMarker = null;
        let routingControl = null;
        let isDirectionMode = false;
        let startPoint = null;
        let endPoint = null;
        let startMarker = null;
        let endMarker = null;

        // Custom Marker Icons
        const createNeonIcon = (colorClass = '') => L.divIcon({
            className: 'custom-div-icon',
            html: `<div class="pulse-marker ${colorClass}"></div>`,
            iconSize: [20, 20],
            iconAnchor: [10, 10]
        });

        const neonIcon = createNeonIcon();
        const endNeonIcon = createNeonIcon('end');

        // Geocoding Helper
        const geocode = async (query) => {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const data = await response.json();
                if (data.length > 0) {
                    return {
                        lat: parseFloat(data[0].lat),
                        lng: parseFloat(data[0].lon),
                        name: data[0].display_name
                    };
                }
                return null;
            } catch (err) {
                console.error(err);
                return null;
            }
        };

        // Check for Shared Location on Load
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const lat = params.get('lat');
            const lng = params.get('lng');
            const zoom = params.get('z');

            if (lat && lng) {
                const sharedPos = { lat: parseFloat(lat), lng: parseFloat(lng) };
                map.setView(sharedPos, zoom || 13);
                handleDefaultClick(sharedPos);
                showToast("Arrived at shared location");
            }
        };

        // Update Coordinates Display
        map.on('mousemove', function(e) {
            document.getElementById('coords').innerText = 
                `Lat: ${e.latlng.lat.toFixed(4)}, Lng: ${e.latlng.lng.toFixed(4)}`;
        });

        // Click Logic
        map.on('click', function(e) {
            if (isDirectionMode) {
                handleDirectionClick(e.latlng);
            } else {
                handleDefaultClick(e.latlng);
            }
        });

        function handleDefaultClick(latlng) {
            if (currentMarker) map.removeLayer(currentMarker);
            currentMarker = L.marker(latlng, { icon: neonIcon }).addTo(map);
            currentMarker.bindPopup(`<b>Location Locked</b><br>${latlng.lat.toFixed(4)}, ${latlng.lng.toFixed(4)}`).openPopup();
            map.flyTo(latlng, map.getZoom() < 10 ? 10 : map.getZoom());
        }

        function handleDirectionClick(latlng) {
            if (!startPoint) {
                setStartPoint(latlng, `${latlng.lat.toFixed(4)}, ${latlng.lng.toFixed(4)}`);
                showToast("Select destination...");
            } else if (!endPoint) {
                setEndPoint(latlng, `${latlng.lat.toFixed(4)}, ${latlng.lng.toFixed(4)}`);
                calculateRoute();
            }
        }

        function setStartPoint(latlng, label) {
            startPoint = latlng;
            if (startMarker) map.removeLayer(startMarker);
            startMarker = L.marker(latlng, { icon: neonIcon }).addTo(map);
            document.getElementById('start-input').value = label;
        }

        function setEndPoint(latlng, label) {
            endPoint = latlng;
            if (endMarker) map.removeLayer(endMarker);
            endMarker = L.marker(latlng, { icon: endNeonIcon }).addTo(map);
            document.getElementById('end-input').value = label;
        }

        function calculateRoute() {
            if (!startPoint || !endPoint) {
                showToast("Please provide both points");
                return;
            }

            if (routingControl) map.removeControl(routingControl);

            routingControl = L.Routing.control({
                waypoints: [
                    L.latLng(startPoint.lat, startPoint.lng),
                    L.latLng(endPoint.lat, endPoint.lng)
                ],
                lineOptions: {
                    styles: [
                        { color: '#00f2ff', opacity: 0.8, weight: 6 },
                        { color: '#bc13fe', opacity: 0.4, weight: 10 }
                    ]
                },
                createMarker: function() { return null; },
                addWaypoints: false,
                routeWhileDragging: false
            }).addTo(map);

            routingControl.on('routesfound', function(e) {
                const summary = e.routes[0].summary;
                document.getElementById('route-dist').innerText = (summary.totalDistance / 1000).toFixed(1) + ' km';
                document.getElementById('route-time').innerText = Math.round(summary.totalTime / 60) + ' min';
                document.getElementById('clear-route').style.display = 'block';
                document.getElementById('info-text').innerText = "Optimal route calculated. Review distance and estimated travel time in the panel.";
            });

            routingControl.on('routingerror', function() {
                showToast("No route found between points");
            });
        }

        // Direction Toggle
        document.getElementById('direction-btn').addEventListener('click', function() {
            isDirectionMode = !isDirectionMode;
            this.classList.toggle('active', isDirectionMode);
            const panel = document.getElementById('direction-inputs');
            
            if (isDirectionMode) {
                panel.style.display = 'block';
                document.getElementById('search-input').parentElement.parentElement.style.display = 'none';
                clearRoute();
                showToast("Direction mode: Type or click map");
            } else {
                panel.style.display = 'none';
                document.getElementById('search-input').parentElement.parentElement.style.display = 'flex';
                clearRoute();
            }
        });

        // Use Current Location for Start
        document.getElementById('start-locate-btn').addEventListener('click', () => {
            map.locate({setView: true, maxZoom: 16});
            showToast("Fetching current position...");
        });

        map.on('locationfound', (e) => {
            if (isDirectionMode) {
                setStartPoint(e.latlng, "Current Location");
                showToast("Start point set to current location");
            } else {
                handleDefaultClick(e.latlng);
            }
        });

        // Calculate Route from inputs
        document.getElementById('calc-route-btn').addEventListener('click', async () => {
            const startVal = document.getElementById('start-input').value;
            const endVal = document.getElementById('end-input').value;

            if (!startPoint && startVal) {
                const res = await geocode(startVal);
                if (res) setStartPoint({lat: res.lat, lng: res.lng}, startVal);
            }
            if (!endPoint && endVal) {
                const res = await geocode(endVal);
                if (res) setEndPoint({lat: res.lat, lng: res.lng}, endVal);
            }

            calculateRoute();
        });

        // Share Location Logic
        document.getElementById('share-btn').addEventListener('click', () => {
            const targetPos = currentMarker ? currentMarker.getLatLng() : map.getCenter();
            const zoom = map.getZoom();
            const baseUrl = window.location.href.split('?')[0];
            const shareUrl = `${baseUrl}?lat=${targetPos.lat.toFixed(6)}&lng=${targetPos.lng.toFixed(6)}&z=${zoom}`;

            const tempInput = document.createElement('input');
            tempInput.style.position = 'absolute';
            tempInput.style.left = '-9999px';
            tempInput.value = shareUrl;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            showToast("Link copied to clipboard!");
            document.body.removeChild(tempInput);
        });

        function clearRoute() {
            if (routingControl) map.removeControl(routingControl);
            if (startMarker) map.removeLayer(startMarker);
            if (endMarker) map.removeLayer(endMarker);
            if (currentMarker) map.removeLayer(currentMarker);
            
            startPoint = null;
            endPoint = null;
            document.getElementById('start-input').value = '';
            document.getElementById('end-input').value = '';
            document.getElementById('route-dist').innerText = '---';
            document.getElementById('route-time').innerText = '---';
            document.getElementById('clear-route').style.display = 'none';
            document.getElementById('info-text').innerText = "Explore the global node network. Drop a marker or use the share button.";
        }

        document.getElementById('clear-route').addEventListener('click', clearRoute);

        document.getElementById('locate-btn').addEventListener('click', () => {
            map.locate({setView: true, maxZoom: 16});
        });

        // Search logic
        const mockSearch = async () => {
            const query = document.getElementById('search-input').value;
            if (!query) return;
            const res = await geocode(query);
            if (res) {
                map.flyTo([res.lat, res.lng], 13);
                handleDefaultClick({lat: res.lat, lng: res.lng});
            } else {
                showToast("Location not found");
            }
        };

        document.getElementById('search-btn').addEventListener('click', mockSearch);
        document.getElementById('search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') mockSearch();
        });

    </script>
</body>
</html>
